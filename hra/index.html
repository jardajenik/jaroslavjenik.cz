*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;color:#3b2a1e;background:#140d07;
 background-image:radial-gradient(ellipse at center,#2a1c10 0%,#140d07 70%)}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;z-index:20;background:radial-gradient(ellipse at center,rgba(30,18,8,.35),rgba(15,9,4,.85))}
.ov.show{display:flex}
.panel{position:relative;max-width:580px;width:100%;max-height:100%;overflow:auto;text-align:center;padding:20px 26px 18px;color:#3b2a1e;
 background:#e3d4b2;
 background-image:radial-gradient(circle at 18% 12%,rgba(120,80,40,.22),transparent 38%),radial-gradient(circle at 88% 85%,rgba(100,65,30,.26),transparent 42%),radial-gradient(circle at 70% 25%,rgba(255,248,225,.45),transparent 45%),radial-gradient(circle at 30% 80%,rgba(140,95,50,.14),transparent 30%);
 border:2px solid rgba(59,42,30,.8);border-radius:22px 6px 26px 8px/8px 24px 6px 26px;
 box-shadow:0 14px 34px rgba(0,0,0,.6),inset 0 0 38px rgba(110,72,35,.45);transform:rotate(-.4deg)}
.panel h1{font-family:Kalam,cursive;font-weight:700;font-size:50px;line-height:1;margin:4px 0 4px;color:#3b2a1e;letter-spacing:1px}
.panel h1 .a{color:#8f3a2a}.panel h1 .b{color:#3f5f6a}
.panel h2{font-family:Kalam,cursive;font-weight:700;font-size:32px;margin:0 0 2px}
.panel .big{font-family:Kalam,cursive;font-weight:700;font-size:64px;line-height:1;color:#8f3a2a;margin:2px 0}

const isHex=col=>typeof col==='string'&&col[0]==='#';
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

const mtof = m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,vol,dest,slide,att){
  const a=AU.ctx; if(!a) return;

}
function noise(t,dur,vol,dest,hp){

function bell(f,t,vol,dest){tone(f,t,1.6,'sine',vol,dest);tone(f*2,t,0.7,'sine',vol*0.22,dest);tone(f*3.01,t,0.3,'sine',vol*0.08,dest);}
function sfx(name){

    case 'boing': tone(160,t,0.45,'triangle',0.35,null,700); break;
    case 'get': bell(1046,t,0.2); bell(1568,t+0.09,0.14); break;
    case 'money': bell(1318,t,0.18); bell(1760,t+0.07,0.16); noise(t,0.05,0.12,null,6000); break;
    case 'mixed': tone(520,t,0.12,'triangle',0.15); tone(330,t+0.1,0.3,'triangle',0.15,null,250); break;
    case 'hit': tone(130,t,0.35,'sine',0.55,null,55); noise(t,0.18,0.25,null,900); break;
    case 'fall': tone(500,t,0.7,'sine',0.3,null,80); break;

function kick(t){tone(110,t,0.25,'sine',0.6,AU.music,45);}
function snare(t){noise(t,0.1,0.25,AU.music,2200);}

function makeSong(cfg){
  const rnd=mulberry32(cfg.seed||1);
  const scale = cfg.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
  const prog = cfg.prog||(cfg.minor?[0,5,2,6]:[0,4,5,3]);
  const mel=[]; let deg=7;
  for(let b=0;b<4;b++){const cd=prog[b];const ct=[cd,cd+2,cd+4];
    for(let s=0;s<16;s++){
      let play = s%4===0 ? rnd()<0.85 : s%2===0 ? rnd()<(cfg.busy||0.45) : rnd()<(cfg.busy?cfg.busy*0.3:0.12);
      if(b===3&&s>=12) play = s===12;
      if(!play){mel.push(null);continue;}
      if(s%4===0){let best=deg,bd=99;for(const c0 of ct)for(const oc of [0,7,14]){const v=c0+oc;const d=Math.abs(v-deg)+rnd()*2.5;if(d<bd&&v>=3&&v<=13){bd=d;best=v;}}deg=best;}
      else deg=clamp(deg+[-2,-1,-1,1,1,2][Math.floor(rnd()*6)],3,13);
      mel.push(deg);
    }}
  return {cfg,scale,prog,mel};
}
const dm = (sc,root,d)=>root+sc[((d%7)+7)%7]+12*Math.floor(d/7);
function playStep(s,i,t,spb){
  const st=i%16, bar=Math.floor(i/16), cd=s.prog[bar], R=s.cfg.root, M=AU.music, C=s.cfg;
  if(C.pad&&st===0){[cd,cd+2,cd+4].forEach((d,k)=>tone(mtof(dm(s.scale,R-12,d)),t+k*0.04,spb*16*1.05,'triangle',C.padVol||0.045,M,null,0.9));}
  if(st===0||st===8||(C.drums&&st===14)) tone(mtof(dm(s.scale,R-24,cd)),t,spb*(st===14?1.6:5),'sine',C.bassVol||0.4,M,null,0.04);
  if(C.arp&&st%2===0){const ar=[cd,cd+2,cd+4,cd+2];tone(mtof(dm(s.scale,R-12,ar[(st/2)%4])),t,spb*2.2,C.arpWave||'triangle',C.arpVol||0.05,M,null,0.02);}

  if(C.drums){if(st===0||st===8)kick(t);if(st===4||st===12)snare(t);if(C.hats&&st%2===1)hat(t);}
  if(C.crackle&&Math.random()<0.45) noise(t+Math.random()*spb,0.005,0.025+Math.random()*0.05,AU.master,2500);
}
function startMusic(cfg){
  stopMusic(); if(!AU.ctx||!cfg) return;
  const s=makeSong(cfg); AU.song=s; let step=0; let next=AU.ctx.currentTime+0.12; const spb=60/cfg.bpm/4;
  AU.timer=setInterval(()=>{ if(!AU.ctx) return; while(next<AU.ctx.currentTime+0.15){ playStep(s,step,next,spb); next+=spb; step=(step+1)%64; } },30);
}
function stopMusic(){ if(AU.timer){clearInterval(AU.timer);AU.timer=null;} }

function figure(c,o,t,mv){
  const H=o.h||46,s=H/46,sk=o.skin||'#d6ae88',sh=o.shirt||'#6a7a8a',pa=o.pants||'#3c4452',hr=o.hair||'#4a3020';
  const a=mv?Math.sin(t*(o.spd||6))*0.38:0;c.save();c.scale(s,s);
  if(o.walker){ln(c,9,-26,13,0,'#9a9a92',1.4);ln(c,15,-26,19,0,'#9a9a92',1.4);ln(c,9,-26,15,-26,'#9a9a92',1.4);ln(c,11,-14,17,-14,'#9a9a92',1);}
  if(o.sit){box(c,-8,-20,16,4,o.seat||'#5a6a7a',1);limb(c,-2,-20,13,-1.4,pa,3.2,'#2a2018',false);limb(c,8,-17,15,0.05,pa,3.2,'#2a2018',true);c.translate(0,-2);}
  else if(o.dress){limb(c,-3,-16,16,a,sk,2.8,'#2a2018',true);limb(c,3,-16,16,-a,sk,2.8,'#2a2018',true);}
  else{limb(c,-3,-20,20,a,shade(pa,0.85),3.3,'#2a2018',true);limb(c,3,-20,20,-a,pa,3.3,'#2a2018',true);}
  c.save();c.translate(0,-20);c.rotate(o.stoop||0);
  if(o.dress)poly(c,[-8,6,8,6,6,-17,-6,-17],o.dress);else box(c,-7,-18,14,20,sh,3);
  if(o.apron)box(c,-5,-14,10,16,o.apron,2);if(o.coat)box(c,-7.5,-18,15,24,o.coat,3);if(o.tie)poly(c,[0,-17,-1.6,-15,0,-6,1.6,-15],o.tie);
  if(o.belly)ell(c,3,-6,8,7,sh);
  const arm=o.arm||'swing';
  limb(c,-3,-16,15,arm==='up'?-2.6:arm==='fold'?-0.6:a*0.8,shade(o.coat||o.dress||sh,0.82),2.8,sk,false);
  // hlava
  const hx=1,hy=-25;circ(c,hx,hy,6.6,sk);
  const st=o.hs||'short';c.fillStyle=grade(hr);

  else if(st==='bald'){circ(c,hx-6,hy+1,2,hr);}
  else if(st==='perm'){for(let i=0;i<7;i++)circ(c,hx-6+i*2,hy-6+Math.sin(i)*1.5,2.6,hr);}
  if(o.hat==='cap'){box(c,hx-7,hy-8,14,5,o.hatc||'#495057',1.5);box(c,hx+2,hy-4.5,8,1.6,o.hatc||'#495057',0.8);}
  if(o.hat==='nurse'){box(c,hx-5,hy-10,10,4,'#e8e2d2',1);txt(c,'+',hx,hy-8,4,'#9a2a20',{f:HAND});}
  if(o.hat==='chef'){box(c,hx-6,hy-14,12,8,'#ece6d6',3);}
  if(o.hat==='straw'){ell(c,hx,hy-4,11,2,'#d6b46a');box(c,hx-5,hy-10,10,6,'#d6b46a',2);}
  if(o.glasses){c.strokeStyle=grade('#2b1e12');c.lineWidth=0.7;c.beginPath();c.arc(hx+3.4,hy-0.8,1.9,0,7);c.stroke();}
  circ(c,hx+3.4,hy-0.8,0.95,'#1e140c');

  if(o.shades)box(c,hx+0.5,hy-2.4,6.5,2.8,'#1a120a',1);

  if(hold==='syringe'){limb(c,4,-16,12,-1.3,sh,2.8,sk,false);ln(c,14,-20,24,-22,'#c9d6d6',2.2);ln(c,24,-22,28,-23,'#6a6a6a',0.6);}

  else if(hold==='phone'){limb(c,4,-16,10,-1.9,sh,2.8,sk,false);box(c,10,-28,3,5,'#1a1a1a',0.6);}
  else if(hold==='case'){limb(c,4,-16,15,0.1,sh,2.8,sk,false);box(c,1,0,12,9,'#3a2818',1.5);}
  else if(hold==='paper'){limb(c,4,-16,11,-1.4,sh,2.8,sk,false);paper(c,12,-30,10,13,0.1,'#e8e2d2');}
  else if(hold==='cane'){limb(c,4,-16,13,-0.4,sh,2.8,sk,false);ln(c,10,-6,12,20,'#6b4426',1.5);}
  else if(hold==='tray'){limb(c,4,-16,10,-1.5,sh,2.8,sk,false);ell(c,14,-28,8,1.6,'#a9a9a0');}

}

const G = {state:'menu',t:0,menuT:0,li:0,level:null,stats:{z:3,s:0,p:0},startStats:null,p:null,plats:[],items:[],obs:[],popups:[],parts:[],flash:0,camX:0,shake:0,lastCause:'',hits:0,got:0};
const K = {left:false,right:false,jump:false,jumpPressed:false};
let SAVE = {unlocked:0,starts:{},done:{}};
try{const s=JSON.parse(localStorage.getItem('ls_save_v2')||'null');if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem('ls_save_v2',JSON.stringify(SAVE));}catch(e){}}

function loadLevel(i){
  G.li=i; const L=G.level=LEVELS[i];
  G.startStats=Object.assign({},G.stats);
  G.plats=[{x:-50,y:GROUND,w:L.length+100,k:'ground'}].concat(L.plats.map(p=>Object.assign({},p)));
  G.items=L.items.map(o=>Object.assign({taken:false,ph:Math.random()*6},o));
  G.obs=L.obs.map(o=>Object.assign({dir:-1,hy:0,vy:0,yo:0,ph:Math.random()*6,rot:0,y:GROUND,b:'static'},o));
  const lk=look(L.year);
  G.p={x:L.startX,y:GROUND-lk.h,w:lk.w,h:lk.h,vx:0,vy:0,onGround:true,face:1,inv:0,coy:0,buf:0,anim:0,stun:0,safeX:L.startX,L:lk};
  G.camX=0; G.popups=[]; G.parts=[]; G.flash=0; G.hits=0; G.got=0; G.shake=0;
}
function applyFx(fx){const s=G.stats;if(fx.z)s.z=clamp(s.z+fx.z,0,9);if(fx.s)s.s+=fx.s;if(fx.p)s.p+=fx.p;}
function fxText(fx){const a=[];if(fx.z)a.push((fx.z>0?'+':'−')+Math.abs(fx.z)+' zdraví');if(fx.s)a.push((fx.s>0?'+':'−')+Math.abs(fx.s)+' spokojenost');if(fx.p)a.push((fx.p>0?'+':'−')+fmtKc(Math.abs(fx.p)));return a.join(' ');}
function popup(x,y,s,col){G.popups.push({x,y,s,col,t:0});}
function burst(x,y,n,col,grow,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(sp||40)*(0.4+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,r:grow?1.5+Math.random()*2:0.6+Math.random()*1.1,col,t:0,life:0.5+Math.random()*0.5,grow});}}

function hurt(o,fromX){
  const p=G.p; if(p.inv>0) return;
  applyFx(o.fx); popup(p.x+p.w/2,p.y-6,fxText(o.fx)+' · '+o.n,'#8a2a1e'); burst(p.x+p.w/2,p.y+p.h*0.5,9,'rgba(120,100,80,.5)',true,30); G.flash=0.5;
  p.inv=1.4; p.stun=0.28; p.vy=-210; const d=Math.sign(p.x+p.w/2-fromX)||-p.face; p.vx=d*150;
  G.lastCause=o.death; G.hits++; G.shake=0.25; sfx('hit');
  if(G.stats.z<=0) die();
}

/* ---------- update ---------- */
function update(dt){
  const p=G.p, L=G.level, LK=p.L;
  const dir=(K.right?1:0)-(K.left?1:0);
  if(p.stun>0){p.stun-=dt;}
  else if(dir){const target=dir*LK.speed;const acc=p.onGround?1500:1000;p.vx+=clamp(target-p.vx,-acc*dt,acc*dt);p.face=dir;}
  else{const fr=p.onGround?1700:350;p.vx-=Math.sign(p.vx)*Math.min(Math.abs(p.vx),fr*dt);}
  if(K.jumpPressed){p.buf=0.13;K.jumpPressed=false;}
  p.buf-=dt; p.coy-=dt;
  if(p.buf>0&&p.coy>0){p.vy=-LK.jump;p.buf=0;p.coy=0;p.onGround=false;sfx('jump');}
  const GV=GRAV*(L.grav||1);
  if(!K.jump&&p.vy<0) p.vy+=GV*1.8*dt;
  p.vy=Math.min(p.vy+GV*dt,720);
  p.x=clamp(p.x+p.vx*dt,0,L.length-p.w);
  const prevB=p.y+p.h; p.y+=p.vy*dt; const b=p.y+p.h;

    if(o.b==='patrol'||o.b==='hop'||o.b==='fly'||o.b==='roll'){o.x+=o.dir*o.sp*dt;if(o.x<o.x1){o.x=o.x1;o.dir=1;}if(o.x>o.x2){o.x=o.x2;o.dir=-1;}}

const TP = 512; let RS = 2; let TILES = {key:'',list:[]};

  for(const d of L.decor){if(d[0]+d[1]>x0-60&&d[0]<x1+60)d[2](c,0);}
  INK=0;PAINT=0;L.floor(c,x0,x1);INK=1;PAINT=1;
  for(const pl of L.plats){if(pl.x+pl.w>x0-10&&pl.x<x1+10&&PLAT[pl.k])PLAT[pl.k](c,pl,0);}
  if(L.over)for(const d of L.over){if(d[0]+d[1]>x0-60&&d[0]<x1+60)d[2](c,0);}

function renderTile(L,i){

  return cv;
}
function getTile(L,li,i){const key=li+'|'+RS;if(TILES.key!==key)TILES={key,list:[]};if(!TILES.list[i])TILES.list[i]=renderTile(L,i);return TILES.list[i];}

setTimeout(()=>{if(!FONTS_OK){FONTS_OK=true;TILES={key:'',list:[]};}},2500);
function prerender(L,li,cam){if(!FONTS_OK)return;const key=li+'|'+RS;if(TILES.key!==key)TILES={key,list:[]};const n=Math.ceil(L.length/tileW())+1;const c0=Math.floor(cam/tileW());
  for(let d=0;d<n;d++){for(const i of [c0+d,c0-d]){if(i<0||i>=n)continue;if(!TILES.list[i]){TILES.list[i]=renderTile(L,i);return;}}}}
const DUST=[];{const R=mulberry32(5);for(let i=0;i<34;i++)DUST.push({x:R()*620,y:R()*270,r:0.4+R()*1.1,a:0.15+R()*0.35,vx:(R()-0.5)*3,vy:-1-R()*3,ph:R()*6});}
function drawWorld(c,L,li,cam,t,withEntities){

  for(let i=Math.max(0,i0);i<=i1;i++){const tl=getTile(L,li,i);c.drawImage(tl,i*tw,0,tw,tl.height/RS);}

    for(const it of G.items){if(it.taken||it.x<x0-20||it.x>x1+20)continue;const by=Math.sin(t*2.4+it.ph)*1.8;glow(c,it.x,it.y+by,16,'rgba(255,215,140,A)',0.45+Math.sin(t*3+it.ph)*0.1);c.save();c.translate(it.x,it.y+by);ITEMS[it.t].d(c,t);c.restore();}
    for(const o of G.obs){if(o.x<x0-40||o.x>x1+40)continue;const D=OBST[o.t];c.save();c.translate(o.x,o.y+o.hy+o.yo);if(o.b!=='static'&&!D.nf)c.scale(o.dir>0?1:-1,1);D.d(c,o,t);c.restore();
      if(D.say&&((t+o.ph)%3.2)<1.3) bubble(c,o.x,o.y+o.hy+o.yo-D.h-6,(o.t==='pepicek'&&o.hy>-1)?'Grrr':D.say);}

    for(const pp of G.popups){const a=1-pp.t/1.6;c.globalAlpha=clamp(a*1.6,0,1);const px=clamp(pp.x,cam+70,cam+VIEW_W-70),py=pp.y-16-pp.t*14;c.font='bold 8px '+HAND;const w=Math.min(200,c.measureText(pp.s).width+10);
      c.save();c.translate(px,py);c.rotate(-0.02+hsh(pp.x|0,3)*0.03);box(c,-w/2,-6,w,12,'#e7dabb',1);txt(c,pp.s,0,0.3,8,pp.col,{f:HAND,max:w-6});c.restore();c.globalAlpha=1;}

}
function scrap(c,x,y,w,h,sd){const A=wob(rectPts(x,y,w,h,1),0.8,sd);c.fillStyle='rgba(15,9,4,.45)';trace(c,A.map(p=>[p[0]+1.3,p[1]+1.6]));c.fill();trace(c,A);const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#e6d9bb');g.addColorStop(1,'#c7b48c');c.fillStyle=g;c.fill();c.strokeStyle=INKC;c.lineWidth=0.7;c.stroke();}

  panel.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();audioInit();sfx('click');ACTIONS[b.dataset.act](b.dataset.arg);}));

function updateChrome(){const playing=G.state==='play';document.getElementById('hudb').style.display=(G.state==='menu')?'none':'flex';document.getElementById('touch').style.display=(IS_TOUCH&&playing)?'block':'none';}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function statsHTML(s){return `<div class="stats"><span class="stat">Zdraví ${s.z}</span><span class="stat">Spokojenost ${s.s}</span><span class="stat">Prachy ${esc(fmtKc(s.p))}</span></div>`;}

const ACTIONS={
  newlife(){G.stats={z:3,s:0,p:0};SAVE.starts={0:{z:3,s:0,p:0}};persist();loadLevel(0);showIntro();},
  year(i){i=+i;if(i>SAVE.unlocked||!LEVELS[i])return;G.stats=Object.assign({z:3,s:0,p:0},SAVE.starts[i]||{});loadLevel(i);showIntro();},

  next(){if(G.li+1<LEVELS.length){loadLevel(G.li+1);showIntro();}else showEnd();},
  retry(){G.stats=Object.assign({},G.startStats);loadLevel(G.li);showIntro();},

function epitaph(s){
  if(s.z>=5&&s.s>=40&&s.p>=100000) return 'Žil naplno. Doporučuje.';
  if(s.p>=150000&&s.s<15) return 'Byl bohatý, ale nešťastný.';
  if(s.s>=40&&s.p<20000) return 'Neměl ani korunu, ale smál se pořád.';
  if(s.p<0) return 'Odešel na Mars. Před exekutorem.';
  if(s.z>=7) return 'Zdravý jako řípa. Až do konce.';

const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k||e.code==='Space')e.preventDefault();
  if(ov.classList.contains('show')){if((e.code==='Enter'||e.code==='Space')&&primary&&!e.repeat&&performance.now()-shownAt>700){audioInit();const f=primary;primary=null;f();}return;}
  if(e.code==='KeyP'||e.code==='Escape'){pause();return;}
  if(e.code==='KeyM'){setMuted(!AU.muted);return;}
  if(k){if(k==='jump'&&!K.jump)K.jumpPressed=true;K[k]=true;}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=false;});
function bindTouch(id,key){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();audioInit();if(key==='jump'&&!K.jump)K.jumpPressed=true;K[key]=true;el.classList.add('on');};
  const off=e=>{e.preventDefault();K[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());}
bindTouch('tl','left');bindTouch('tr','right');bindTouch('tj','jump');
document.getElementById('bPause').addEventListener('click',()=>{audioInit();if(G.state==='play')pause();else if(G.state==='paused')ACTIONS.resume();});
document.getElementById('bMute').addEventListener('click',()=>{audioInit();setMuted(!AU.muted);});
addEventListener('blur',()=>{K.left=K.right=K.jump=false;pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('pointerdown',()=>audioInit(),{once:true});

/* ==========================================================
   ROZLIŠENÍ + SMYČKA
   ========================================================== */
function resize(){
  const W=innerWidth,H=innerHeight; DPR=Math.min(window.devicePixelRatio||1,2);
  VIEW_W=clamp(Math.round(VIEW_H*W/H),400,620); SCALE=Math.min(W/VIEW_W,H/VIEW_H);
  const cw=Math.floor(VIEW_W*SCALE),ch=Math.floor(VIEW_H*SCALE);
  cv.style.width=cw+'px';cv.style.height=ch+'px';RS=Math.min(SCALE*DPR,3.2);cv.width=Math.round(VIEW_W*RS);cv.height=Math.round(VIEW_H*RS);TILES={key:'',list:[]};
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));
resize(); setMuted(AU.muted);
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;G.t+=dt;if(G.state==='play')update(dt);else if(G.state==='menu')G.menuT+=dt;render();if(G.state==='menu')prerender(LEVELS[0],0,0);else if(G.level)prerender(G.level,G.li,G.camX);requestAnimationFrame(loop);}
showMenu(); requestAnimationFrame(loop);
window.__LS={G,LEVELS,loadLevel,ACTIONS,K,look};
</script>
