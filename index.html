:root{--bg:#0f141a;--line:rgba(200,214,224,.6);--mid:rgba(200,214,224,.34);--faint:rgba(200,214,224,.13);--text:#ebe6d9;--amber:#e0a458;--rx:0deg;--ry:0deg;--gx:50%;--gy:30%}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--bg);color:var(--text);font-family:Plex,ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;
 background-image:
  radial-gradient(ellipse at 50% 42%,rgba(60,84,110,.28),transparent 62%),
  linear-gradient(rgba(200,214,224,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(200,214,224,.055) 1px,transparent 1px),
  linear-gradient(rgba(200,214,224,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(200,214,224,.028) 1px,transparent 1px);
 background-size:100% 100%,60px 60px,60px 60px,12px 12px,12px 12px;background-position:0 0,50% 50%,50% 50%,50% 50%,50% 50%}
#frame{position:fixed;inset:12px;border:1px solid var(--mid);pointer-events:none;z-index:1}
#frame i{position:absolute;background:var(--mid)}
#frame i:nth-child(1){left:50%;top:-7px;width:1px;height:14px}#frame i:nth-child(2){left:50%;bottom:-7px;width:1px;height:14px}
#frame i:nth-child(3){top:50%;left:-7px;height:1px;width:14px}#frame i:nth-child(4){top:50%;right:-7px;height:1px;width:14px}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1400px;padding:20px 20px 110px}
#wrap{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry))}
#card{--cw:min(520px,74vw);width:var(--cw);aspect-ratio:85/55;position:relative;cursor:pointer;transform-style:preserve-3d}
#flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
#card.flipped #flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r,12px);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
 background:linear-gradient(155deg,rgba(235,230,217,.075),rgba(235,230,217,.02) 60%),repeating-linear-gradient(135deg,rgba(200,214,224,.035) 0 1px,transparent 1px 7px);
 opacity:0;transition:opacity 1s ease 1.1s}
body.in .face{opacity:1}
.front{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;padding:7.5% 8%;column-gap:14px}
.mono{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(15px,2.4vw,22px);color:var(--amber);line-height:1;letter-spacing:-.02em}
.mid{grid-column:1/3;grid-row:2;align-self:center}
.name{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(24px,5vw,44px);line-height:1.02;letter-spacing:-.012em;color:var(--text)}
.name i{font-style:italic;color:#cfc8b6}
.rule{width:48px;height:1px;background:linear-gradient(90deg,var(--amber),rgba(224,164,88,0));margin-top:clamp(8px,1.6vw,14px)}
.contacts{grid-column:1;grid-row:3;align-self:end;font-size:clamp(11px,1.6vw,14px);letter-spacing:.02em;line-height:1.75;color:#d6d2c6;-webkit-user-select:text;user-select:text;cursor:text}
.apps{grid-column:2;grid-row:3;align-self:end;display:flex;gap:clamp(8px,1.3vw,12px);padding-bottom:.4em}
.apps span{width:14px;height:14px;display:flex;align-items:center;justify-content:center;opacity:.6;color:var(--text)}
.apps svg,.apps img{width:14px;height:14px;display:block}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.bigmono{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(56px,11vw,104px);line-height:1;color:transparent;-webkit-text-stroke:1px var(--amber)}
.motto{font-size:clamp(10px,1.5vw,12px);letter-spacing:.24em;text-transform:uppercase;color:var(--mid)}
.glare{position:absolute;inset:0;border-radius:var(--r,12px);pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,236,200,.12),transparent 45%);transform:translateZ(1px)}
#dims{position:absolute;pointer-events:none;overflow:visible}
#dims .l{stroke:var(--line);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
#dims .o{stroke:var(--text);stroke-width:1.2;fill:none}
#dims .c{stroke:var(--mid);stroke-width:1;stroke-dasharray:10 3 2 3}
#dims .a{fill:var(--line)}
#dims text{font:400 10px Plex,monospace;fill:var(--line);letter-spacing:.08em}
#dims .am{fill:var(--amber)}
#dims .d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.5,0,.2,1) forwards;animation-delay:var(--t,0s)}
#dims .f{opacity:0;animation:fade .7s ease forwards;animation-delay:var(--t,0s)}
#dims.still .d{animation:none;stroke-dashoffset:0}#dims.still .f{animation:none;opacity:1}
#dims .lead{transition:opacity .4s}
#card.flipped~#dims .lead{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
#view{margin-top:clamp(46px,8vh,74px);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mid);opacity:0;transition:opacity 1s ease 2s;text-align:center}
body.in #view{opacity:1}
#tb{position:fixed;right:12px;bottom:12px;z-index:2;border-collapse:collapse;font-size:10px;letter-spacing:.08em;background:var(--bg);opacity:0;transition:opacity 1s ease 1.6s}
body.in #tb{opacity:1}
#tb td{border:1px solid var(--mid);padding:5px 10px 4px;vertical-align:top;white-space:nowrap;color:var(--text)}
#tb small{display:block;font-size:8px;letter-spacing:.2em;color:var(--mid);margin-bottom:2px}
#tb .nm{font-family:Fraunces,Georgia,serif;font-size:15px;letter-spacing:0}
#play{all:unset;cursor:pointer;display:block;color:var(--text);transition:color .25s,letter-spacing .35s}
#play:hover,#play:focus-visible{color:var(--amber);letter-spacing:.16em}
#play::after{content:" ▸";color:var(--amber)}
#hx,#hy{position:fixed;background:var(--faint);pointer-events:none;z-index:0;display:none}
#hx{left:0;right:0;height:1px}#hy{top:0;bottom:0;width:1px}
#ro{position:fixed;z-index:3;pointer-events:none;font-size:10px;letter-spacing:.08em;color:var(--line);background:var(--bg);border:1px solid var(--faint);padding:2px 6px;display:none;white-space:nowrap}
#ro.on{color:var(--amber);border-color:rgba(224,164,88,.4)}
body.mouse #hx,body.mouse #hy,body.mouse #ro{display:block}
#game{position:fixed;inset:0;z-index:20;background:#140d07;opacity:0;pointer-events:none;transition:opacity .5s}
#game.on{opacity:1;pointer-events:auto}
#game iframe{width:100%;height:100%;border:0;display:block}
#close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,220,192,.5);background:rgba(20,13,7,.5);color:#e8dcc0;font:400 22px/1 sans-serif;cursor:pointer}
@media (max-width:640px){
 #tb{left:12px;right:12px;width:calc(100% - 24px)}#tb td{padding:4px 7px 3px}#tb .hide{display:none}
 #stage{padding-bottom:130px}
}
@media (prefers-reduced-motion:reduce){#flipper,.face,#view,#tb{transition:none}#dims .d{animation:none;stroke-dashoffset:0}#dims .f{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="frame"><i></i><i></i><i></i><i></i></div>
<div id="hx"></div><div id="hy"></div><div id="ro"></div>
<div id="stage">
  <div id="wrap">
    <div id="card" aria-label="Vizitka – Jaroslav Jeník">
      <div id="flipper">
        <div class="face front">
          <div class="mono" aria-hidden="true">JJ</div>
          <div class="mid"><h1 class="name" id="eName">Jaroslav <i>Jeník</i></h1><div class="rule"></div></div>
          <div class="contacts"><div id="eTel">+420 773 520 921</div><div id="eMail">posta@jaroslavjenik.cz</div></div>
          <div class="apps" id="apps" aria-label="Signal, Messenger, WhatsApp, Instagram, Facebook"></div>
        </div>
        <div class="face back" aria-hidden="true"><div class="bigmono">JJ</div><div class="motto">Život je videohra</div></div>
      </div>
      <div class="glare"></div>
    </div>
    <svg id="dims" aria-hidden="true"></svg>
  </div>
  <div id="view">pohled zepředu · M 1:1</div>
</div>
<table id="tb" aria-label="Rohové razítko výkresu">
  <tr><td colspan="2"><small>NÁZEV</small><span class="nm">Jaroslav Jeník</span> — vizitka</td><td class="hide"><small>MĚŘÍTKO</small>1 : 1</td><td><small>LIST</small>1 / 1</td></tr>
  <tr><td><small>KRESLIL</small>JJ</td><td><small>DATUM</small><span id="tbD"></span></td><td class="hide"><small>ČAS</small><span id="tbT"></span></td><td><small>POZN.</small><button id="play" type="button">život je hra</button></td></tr>
</table>
<div id="game" aria-hidden="true"><button id="close" type="button" aria-label="Zavřít hru">×</button></div>
<script>
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement, card=document.getElementById('card'), dims=document.getElementById('dims'), view=document.getElementById('view');

/* ---------- ikony aplikací (jen zobrazení, bez odkazů) ---------- */
const APPS=[['signal','Signal','siSignal'],['messenger','Messenger','siMessenger'],['whatsapp','WhatsApp','siWhatsapp'],['instagram','Instagram','siInstagram'],['facebook','Facebook','siFacebook']];
const appsEl=document.getElementById('apps');let siTried=false;
APPS.forEach(([slug,label])=>{const s=document.createElement('span');s.title=label;s.dataset.slug=slug;const img=new Image();img.alt=label;img.src='https://cdn.simpleicons.org/'+slug+'/ebe6d9';img.onerror=()=>{s.textContent='';s.dataset.missing='1';loadSI();};s.appendChild(img);appsEl.appendChild(s);});
function loadSI(){if(siTried)return;siTried=true;import('https://cdn.jsdelivr.net/npm/simple-icons@13/+esm').then(m=>{appsEl.querySelectorAll('[data-missing]').forEach(s=>{const k=APPS.find(a=>a[0]===s.dataset.slug)[2];const ic=m[k];if(!ic)return;s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="'+ic.path+'"/></svg>';});}).catch(()=>{});}

/* ---------- kóty a popisky (SVG kolem vizitky) ---------- */
let built=false;
function build(){
  const cw=card.offsetWidth, ch=card.offsetHeight, wide=innerWidth>=900, m=wide?120:Math.max(34,Math.min(60,(innerWidth-cw)/2-8));
  const r=cw*2/85; card.style.setProperty('--r',r+'px');
  const W=cw+2*m,H=ch+2*m,x0=m,y0=m,x1=m+cw,y1=m+ch;
  dims.setAttribute('width',W);dims.setAttribute('height',H);dims.setAttribute('viewBox','0 0 '+W+' '+H);dims.style.left=-m+'px';dims.style.top=-m+'px';
  let s='';const L=(a,b,c,d,cl,t)=>{s+=`<line pathLength="1" x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="${cl}" style="--t:${t}s"/>`;};
  const T=(x,y,str,t,o)=>{s+=`<text x="${x}" y="${y}" class="f ${o&&o.c||''}" style="--t:${t}s" text-anchor="${o&&o.a||'middle'}" ${o&&o.r?`transform="rotate(${o.r} ${x} ${y})"`:''}>${str}</text>`;};
  const A=(x,y,dir,t)=>{const p={l:[[0,0],[7,-2.6],[7,2.6]],r:[[0,0],[-7,-2.6],[-7,2.6]],u:[[0,0],[-2.6,7],[2.6,7]],d:[[0,0],[-2.6,-7],[2.6,-7]]}[dir].map(q=>(x+q[0])+','+(y+q[1])).join(' ');s+=`<polygon points="${p}" class="a f" style="--t:${t}s"/>`;};
  // obrys vizitky
  s+=`<rect pathLength="1" x="${x0}" y="${y0}" width="${cw}" height="${ch}" rx="${r}" class="o d" style="--t:.15s"/>`;
  // osy
  const cx=m+cw/2, cy=m+ch/2;
  s+=`<g class="f" style="--t:1.2s"><line class="c" x1="${x0-16}" y1="${cy}" x2="${x0+8}" y2="${cy}"/><line class="c" x1="${x1-8}" y1="${cy}" x2="${x1+16}" y2="${cy}"/><line class="c" x1="${cx}" y1="${y0-16}" x2="${cx}" y2="${y0+8}"/><line class="c" x1="${cx}" y1="${y1-8}" x2="${cx}" y2="${y1+16}"/></g>`;
  // kóta šířky
  const dy=y0-26; L(x0,y0-5,x0,dy-7,'l d',.9);L(x1,y0-5,x1,dy-7,'l d',.9);L(x0,dy,x1,dy,'l d',1.1);A(x0,dy,'l',1.9);A(x1,dy,'r',1.9);T(cx,dy-6,'85',1.9,{c:'am'});
  // kóta výšky
  const dx=x1+26; L(x1+5,y0,dx+7,y0,'l d',1.0);L(x1+5,y1,dx+7,y1,'l d',1.0);L(dx,y0,dx,y1,'l d',1.2);A(dx,y0,'u',2.0);A(dx,y1,'d',2.0);T(dx-6,cy,'55',2.0,{c:'am',r:-90});
  // počátek souřadnic
  s+=`<g class="f" style="--t:1.5s"><circle cx="${x0}" cy="${y1}" r="4" class="l"/><line class="l" x1="${x0-8}" y1="${y1}" x2="${x0+8}" y2="${y1}"/><line class="l" x1="${x0}" y1="${y1-8}" x2="${x0}" y2="${y1+8}"/></g>`;T(x0-8,y1+19,'0,0',1.6,{a:'end'});
  // poloměr rohu
  const k=r*0.2929; L(x1-k,y1-k,x1+16,y1+16,'l d',1.6);L(x1+16,y1+16,x1+30,y1+16,'l d',1.9);T(x1+34,y1+19.5,'R2',2.2,{a:'start'});
  // popisky
  if(wide){const E=id=>{const e=document.getElementById(id);let y=e.offsetTop+e.offsetHeight/2,p=e.offsetParent;while(p&&!p.classList.contains('face')){y+=p.offsetTop;p=p.offsetParent;}return y0+y;};
    s+='<g class="lead">';[['eName','JMÉNO'],['eTel','TELEFON'],['eMail','E-MAIL']].forEach(([id,lab],i)=>{const y=E(id);s+=`<circle cx="${x0+cw*0.045}" cy="${y}" r="1.6" class="a f" style="--t:${2.3+i*.15}s"/>`;L(x0+cw*0.045,y,x0-34,y,'l d',2.3+i*.15);T(x0-40,y+3.5,lab,2.6+i*.15,{a:'end'});});
    const ax=x0+appsEl.offsetLeft+appsEl.offsetWidth/2, ay=y0+appsEl.offsetTop+appsEl.offsetHeight+4;
    s+=`<circle cx="${ax}" cy="${ay}" r="1.6" class="a f" style="--t:2.8s"/>`;L(ax,ay,ax,y1+30,'l d',2.8);T(ax,y1+43,'KANÁLY',3.1);s+='</g>';}
  dims.innerHTML=s; if(built||RM)dims.classList.add('still'); built=true;
}
build(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!built)return;const st=dims.classList.contains('still');build();if(!st)dims.classList.remove('still');});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,120);});
requestAnimationFrame(()=>document.body.classList.add('in'));

/* ---------- náklon, otočení, nitkový kříž se souřadnicemi v mm ---------- */
let tx=0,ty=0,cx=0,cy=0,lastMove=0;const hx=document.getElementById('hx'),hy=document.getElementById('hy'),ro=document.getElementById('ro');
const cz=n=>n.toFixed(1).replace('.',',').replace('-','−');
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;document.body.classList.add('mouse');
  const r=card.getBoundingClientRect();tx=(e.clientX-(r.left+r.width/2))/(innerWidth/2);ty=(e.clientY-(r.top+r.height/2))/(innerHeight/2);lastMove=performance.now();
  hx.style.top=e.clientY+'px';hy.style.left=e.clientX+'px';
  const mmx=(e.clientX-r.left)*85/r.width, mmy=(r.bottom-e.clientY)*55/r.height, inside=mmx>=0&&mmx<=85&&mmy>=0&&mmy<=55;
  ro.textContent='X '+cz(mmx)+'  Y '+cz(mmy)+' mm';ro.classList.toggle('on',inside);
  const rw=ro.offsetWidth+14;ro.style.left=(e.clientX+12+rw>innerWidth-14?e.clientX-rw:e.clientX+12)+'px';ro.style.top=(e.clientY+12+30>innerHeight-14?e.clientY-30:e.clientY+12)+'px';},{passive:true});
document.addEventListener('pointerleave',()=>document.body.classList.remove('mouse'));
card.addEventListener('click',()=>{if(window.getSelection&&String(getSelection()).length)return;const f=card.classList.toggle('flipped');view.textContent=(f?'pohled zezadu':'pohled zepředu')+' · M 1:1';});
function tick(now){const t=now/1000;if(now-lastMove>2500){tx=Math.sin(t*0.35)*0.18;ty=Math.cos(t*0.27)*0.14;}
  cx+=(tx-cx)*0.06;cy+=(ty-cy)*0.06;root.style.setProperty('--ry',(cx*9).toFixed(2)+'deg');root.style.setProperty('--rx',(-cy*7).toFixed(2)+'deg');
  root.style.setProperty('--gx',(50+cx*60).toFixed(1)+'%');root.style.setProperty('--gy',(35+cy*60).toFixed(1)+'%');if(!RM)requestAnimationFrame(tick);}
requestAnimationFrame(tick);

/* ---------- rohové razítko: datum a čas ---------- */
const tbD=document.getElementById('tbD'),tbT=document.getElementById('tbT'),p2=n=>String(n).padStart(2,'0');
function clock(){const d=new Date();tbD.textContent=d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear();tbT.textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
clock();setInterval(clock,1000);

/* ---------- hra ---------- */
const game=document.getElementById('game');
function openGame(){if(!game.querySelector('iframe')){const f=document.createElement('iframe');f.src='hra/index.html';f.title='Život je hra';f.allow='autoplay; fullscreen';game.appendChild(f);}game.classList.add('on');game.setAttribute('aria-hidden','false');setTimeout(()=>{const f=game.querySelector('iframe');f&&f.focus();},400);}
function closeGame(){game.classList.remove('on');game.setAttribute('aria-hidden','true');const f=game.querySelector('iframe');if(f)setTimeout(()=>f.remove(),500);}
document.getElementById('play').addEventListener('click',openGame);
document.getElementById('close').addEventListener('click',closeGame);
addEventListener('message',e=>{if(e.data==='closeGame')closeGame();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&game.classList.contains('on'))closeGame();});
</script>
</body>
</html>
