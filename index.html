:root{--desk:#e9e1d3;--ink:#2b2621;--soft:#6d6457;--paper:#f7f3ea;--rx:0deg;--ry:0deg;--gx:50%;--gy:30%;--shx:18px;--shy:26px;--foil:50%}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--desk);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color 2s;
 background-image:
  repeating-linear-gradient(0deg,rgba(90,70,40,.035) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(90,70,40,.03) 0 1px,transparent 1px 4px),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1300px;padding:20px}
#wrap{position:relative}
#cshadow{position:absolute;inset:0;border-radius:8px;background:rgba(40,28,14,.42);filter:blur(16px);transform:translate(var(--shx),var(--shy));opacity:0;transition:opacity 1.4s ease .5s;pointer-events:none}
#card{--cw:min(580px,86vw);width:var(--cw);aspect-ratio:1.75/1;position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));cursor:pointer;
 opacity:0;translate:0 40px;rotate:-4deg;transition:opacity 1.1s ease,translate 1.4s cubic-bezier(.2,.8,.2,1),rotate 1.4s cubic-bezier(.2,.8,.2,1)}
#card.in{opacity:1;translate:0 0;rotate:-1.2deg}
#stage.in #cshadow{opacity:1}
#flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
#card.flipped #flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
 background:var(--paper);
 background-image:
  linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%,rgba(120,95,60,.06)),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .44  0 0 0 0 .35  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -1px 0 rgba(120,95,60,.12),0 1px 1px rgba(60,40,20,.18),0 2px 4px rgba(60,40,20,.10)}
.front{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;padding:7.5% 8%;column-gap:16px}
.mono{grid-column:1;grid-row:1;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(17px,2.6vw,24px);letter-spacing:-.02em;line-height:1;
 background:linear-gradient(105deg,#7a5228 0%,#c99a55 calc(var(--foil) - 18%),#f5dfaa var(--foil),#c99a55 calc(var(--foil) + 18%),#7a5228 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5px 0 rgba(255,255,255,.6))}
.mid{grid-column:1/3;grid-row:2;align-self:center}
.name{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(27px,5.4vw,48px);line-height:1.02;letter-spacing:-.012em;color:var(--ink);
 text-shadow:0 1px 0 rgba(255,255,255,.75),0 -.5px 0 rgba(0,0,0,.18)}
.name i{font-style:italic;color:#4a3b2b}
.rule{width:52px;height:1px;background:linear-gradient(90deg,#b88a4c,rgba(184,138,76,0));margin-top:clamp(10px,2vw,16px)}
.contacts{grid-column:1;grid-row:3;align-self:end;font-size:clamp(12px,1.75vw,15px);letter-spacing:.035em;line-height:1.75;color:#3b352d;font-weight:500;-webkit-user-select:text;user-select:text;cursor:text}
.contacts .lab{display:inline-block;width:1.4em;font-weight:400;color:var(--soft);font-size:.82em;letter-spacing:.06em}
.apps{grid-column:2;grid-row:3;align-self:end;display:flex;gap:clamp(9px,1.4vw,13px);padding-bottom:.35em}
.apps span{width:15px;height:15px;display:flex;align-items:center;justify-content:center;opacity:.55;color:var(--ink)}
.apps svg,.apps img{width:15px;height:15px;display:block}
.hint{position:absolute;right:12px;top:10px;font-size:13px;color:var(--soft);opacity:.35;transition:opacity .3s}
#card:hover .hint{opacity:.7}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.bigmono{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(64px,12vw,120px);line-height:1;color:var(--paper);
 text-shadow:-1px -1px 0 rgba(255,255,255,.9),1px 1px 1px rgba(90,65,35,.28),0 0 0 rgba(0,0,0,0)}
.motto{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(13px,1.9vw,16px);color:var(--soft);letter-spacing:.02em}
.glare{position:absolute;inset:0;border-radius:7px;pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,250,235,.38),rgba(255,250,235,0) 42%);mix-blend-mode:soft-light;transform:translateZ(1px)}
#play{margin-top:clamp(34px,6vh,56px);background:none;border:0;font:500 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);cursor:pointer;padding:10px 12px;opacity:0;transition:opacity 1.2s ease 1.6s,color .3s,letter-spacing .4s;position:relative}
#stage.in #play{opacity:.8}
#play:hover,#play:focus-visible{color:var(--ink);letter-spacing:.42em;opacity:1}
#play::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:1px;background:currentColor;transform:scaleX(.18);transition:transform .45s cubic-bezier(.2,.7,.2,1);opacity:.6}
#play:hover::after{transform:scaleX(1)}
#sun{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;z-index:5}
#game{position:fixed;inset:0;z-index:20;background:#140d07;opacity:0;pointer-events:none;transition:opacity .5s}
#game.on{opacity:1;pointer-events:auto}
#game iframe{width:100%;height:100%;border:0;display:block}
#close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,220,192,.5);background:rgba(20,13,7,.5);color:#e8dcc0;font:400 22px/1 Manrope,sans-serif;cursor:pointer}
@media (max-width:560px) and (orientation:portrait){
 #card{--cw:min(330px,80vw);aspect-ratio:1/1.62}
 .front{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;padding:12% 11%}
 .mid{grid-column:1;align-self:center}
 .name{font-size:clamp(32px,10vw,42px)}
 .name i{display:block}
 .contacts{grid-row:3;font-size:14px}
 .apps{grid-column:1;grid-row:4;margin-top:18px}
}
@media (prefers-reduced-motion:reduce){#card,#flipper,#play,#cshadow{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"><div id="cshadow"></div>
  <div id="card" aria-label="Vizitka – Jaroslav Jeník">
    <div id="flipper">
      <div class="face front">
        <div class="mono" aria-hidden="true">JJ</div>
        <div class="mid"><h1 class="name">Jaroslav <i>Jeník</i></h1><div class="rule"></div></div>
        <div class="contacts"><div><span class="lab">T</span>+420 773 520 921</div><div><span class="lab">E</span>posta@jaroslavjenik.cz</div></div>
        <div class="apps" id="apps" aria-label="Signal, Messenger, WhatsApp, Instagram, Facebook"></div>
        <div class="hint" aria-hidden="true">↻</div>
      </div>
      <div class="face back" aria-hidden="true"><div class="bigmono">JJ</div><div class="motto">Život je videohra.</div></div>
    </div>
    <div class="glare"></div>
  </div></div>
  <button id="play" type="button">život je hra</button>
</div>
<canvas id="sun" aria-hidden="true"></canvas>
<div id="game" aria-hidden="true"><button id="close" type="button" aria-label="Zavřít hru">×</button></div>
<script>
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement, stage=document.getElementById('stage'), card=document.getElementById('card'), csh=document.getElementById('cshadow');

/* ---------- ikony aplikací (jen zobrazení, bez odkazů) ---------- */
const APPS=[['signal','Signal','siSignal'],['messenger','Messenger','siMessenger'],['whatsapp','WhatsApp','siWhatsapp'],['instagram','Instagram','siInstagram'],['facebook','Facebook','siFacebook']];
const appsEl=document.getElementById('apps');let siTried=false;
APPS.forEach(([slug,label])=>{const s=document.createElement('span');s.title=label;s.dataset.slug=slug;const img=new Image();img.alt=label;img.src='https://cdn.simpleicons.org/'+slug+'/2b2621';img.onerror=()=>{s.textContent='';s.dataset.missing='1';loadSI();};s.appendChild(img);appsEl.appendChild(s);});
function loadSI(){if(siTried)return;siTried=true;import('https://cdn.jsdelivr.net/npm/simple-icons@13/+esm').then(m=>{appsEl.querySelectorAll('[data-missing]').forEach(s=>{const k=APPS.find(a=>a[0]===s.dataset.slug)[2];const ic=m[k];if(!ic)return;s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="'+ic.path+'"/></svg>';});}).catch(()=>{});}

/* ---------- příchod vizitky ---------- */
setTimeout(()=>{card.classList.add('in');stage.classList.add('in');},RM?0:250);

/* ---------- náklon podle kurzoru, otočení kliknutím ---------- */
let tx=0,ty=0,cx=0,cy=0,hover=false,lastMove=0;
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=card.getBoundingClientRect();tx=((e.clientX-(r.left+r.width/2))/(r.width/2));ty=((e.clientY-(r.top+r.height/2))/(r.height/2));lastMove=performance.now();},{passive:true});
card.addEventListener('click',e=>{if(getSelection&&String(getSelection()).length)return;card.classList.toggle('flipped');});

/* ---------- hra pod tlačítkem ---------- */
const game=document.getElementById('game');
function openGame(){if(!game.querySelector('iframe')){const f=document.createElement('iframe');f.src='hra/index.html';f.title='Život je hra';f.allow='autoplay; fullscreen';game.appendChild(f);f.addEventListener('load',()=>{try{f.focus();}catch(e){}});}game.classList.add('on');game.setAttribute('aria-hidden','false');setTimeout(()=>{const f=game.querySelector('iframe');f&&f.focus();},400);}
function closeGame(){game.classList.remove('on');game.setAttribute('aria-hidden','true');const f=game.querySelector('iframe');if(f){setTimeout(()=>f.remove(),500);}}
document.getElementById('play').addEventListener('click',openGame);
document.getElementById('close').addEventListener('click',closeGame);
addEventListener('message',e=>{if(e.data==='closeGame')closeGame();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&game.classList.contains('on'))closeGame();});

/* ==========================================================
   SLUNCE A STÍNY LISTÍ – podle místního času návštěvníka
   ========================================================== */
const cv=document.getElementById('sun'), c=cv.getContext('2d');
const lo=document.createElement('canvas'), q=lo.getContext('2d');
let W=0,H=0,DPR=1,SC=6;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);SC=W<700?6:7;lo.width=Math.ceil(W/SC);lo.height=Math.ceil(H/SC);}
addEventListener('resize',resize);resize();
// klíčové snímky dne: hodina, barva stolu, barva světla, barva stínu, úhel slunce, délka stínu vizitky
const KEYS=[
 {h:0,   desk:[40,42,50],   light:[255,214,160], shade:[120,124,142], ang:200, len:10, sun:0},
 {h:5.5, desk:[120,112,112],light:[255,210,190], shade:[175,168,170], ang:-15, len:34, sun:.35},
 {h:8,   desk:[226,220,210],light:[255,246,232], shade:[206,201,196], ang:-28, len:28, sun:1},
 {h:12.5,desk:[233,225,211],light:[255,251,240], shade:[214,205,190], ang:-48, len:16, sun:1},
 {h:17,  desk:[234,222,204],light:[255,240,214], shade:[214,198,176], ang:-64, len:28, sun:1},
 {h:19.4,desk:[228,208,184],light:[255,228,192], shade:[206,180,154], ang:-74, len:40, sun:.9},
 {h:21,  desk:[96,86,92],   light:[255,206,150], shade:[150,140,150], ang:200, len:12, sun:0},
 {h:24,  desk:[40,42,50],   light:[255,214,160], shade:[120,124,142], ang:200, len:10, sun:0},
];
const lerp=(a,b,t)=>a+(b-a)*t, lerpA=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
function sky(h){let i=0;while(i<KEYS.length-2&&KEYS[i+1].h<=h)i++;const A=KEYS[i],B=KEYS[i+1],t=(h-A.h)/(B.h-A.h);
  return{desk:lerpA(A.desk,B.desk,t),light:lerpA(A.light,B.light,t),shade:lerpA(A.shade,B.shade,t),ang:lerp(A.ang,B.ang,t),len:lerp(A.len,B.len,t),sun:lerp(A.sun,B.sun,t)};}
const rgb=a=>'rgb('+a.map(v=>Math.round(v)).join(',')+')';
// větve stromu za oknem
function rnd(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rnd(23), BR=[];
for(let b=0;b<5;b++){const br={bx:-0.08+R()*0.35,by:-0.12+R()*0.25,ang:0.25+R()*0.9,len:0.45+R()*0.45,ph:R()*6,leaves:[]};
  for(let k=0;k<26;k++){const s=0.08+R()*0.92;br.leaves.push({s,off:(R()-0.5)*0.16,r:9+R()*22,rot:R()*3,ph:R()*6,e:0.45+R()*0.35});}BR.push(br);}
let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000, d=new Date(), hour=d.getHours()+d.getMinutes()/60;
  const HQ=new URLSearchParams(location.search).get('h');const S=sky(HQ!==null?((+HQ)%24+24)%24:hour);
  // stůl
  root.style.setProperty('--desk',rgb(S.desk));
  const night=1-S.sun;
  // stín vizitky ve směru světla + náklon
  if(performance.now()-lastMove>2500){tx=Math.sin(t*0.35)*0.25;ty=Math.cos(t*0.27)*0.2;}
  cx+=(tx-cx)*0.06;cy+=(ty-cy)*0.06;
  root.style.setProperty('--ry',(cx*6.5).toFixed(2)+'deg');root.style.setProperty('--rx',(-cy*5).toFixed(2)+'deg');
  root.style.setProperty('--gx',(50+cx*40).toFixed(1)+'%');root.style.setProperty('--gy',(30+cy*40).toFixed(1)+'%');root.style.setProperty('--foil',(50+cx*60).toFixed(1)+'%');
  const a=S.ang*Math.PI/180, L=S.len*(night>0.5?0.6:1);
  csh.style.setProperty('--shx',(Math.cos(a+Math.PI)*-L*0.6-cx*8).toFixed(1)+'px');csh.style.setProperty('--shy',(Math.abs(Math.sin(a))*L*0.8+8-cy*6).toFixed(1)+'px');
  // světlo a stíny (malé plátno -> rozmazané zvětšení)
  const w=lo.width,h=lo.height;q.setTransform(1,0,0,1,0,0);
  q.fillStyle=rgb(S.shade);q.fillRect(0,0,w,h);
  q.setTransform(1/SC,0,0,1/SC,0,0);
  if(S.sun>0.05){
    // sluneční skvrna z okna (rovnoběžník podle úhlu slunce)
    const sh=Math.tan((S.ang+90)*Math.PI/180*0.35)*H*0.25;
    q.fillStyle=rgb(S.light.map((v,i)=>lerp(S.shade[i],v,S.sun)));
    q.beginPath();q.moveTo(W*0.06+sh,-H*0.1);q.lineTo(W*1.08+sh,-H*0.1);q.lineTo(W*0.98-sh,H*1.12);q.lineTo(-W*0.06-sh,H*1.12);q.closePath();q.fill();
    // příčky okna
    q.fillStyle=rgb(S.shade);const mx=W*0.5+sh*0.2;q.save();q.translate(mx,H*0.5);q.rotate(-sh/H*0.6);q.fillRect(-W*0.012,-H,W*0.024,H*2);q.restore();
    q.save();q.translate(W*0.5,H*0.08);q.rotate(0.04);q.fillRect(-W,-H*0.012,W*2,H*0.024);q.restore();
    // listí
    const gust=Math.sin(t*0.21)*0.5+Math.sin(t*0.53+1)*0.3;
    q.fillStyle=rgb(S.shade);
    for(const br of BR){const sw=(RM?0:1)*(0.035*Math.sin(t*0.8+br.ph)+0.018*Math.sin(t*2.1+br.ph*2)+0.03*gust);
      const bx=br.bx*W,by=br.by*H,an=br.ang+sw,ln=br.len*Math.min(W,H)*1.2;
      q.lineWidth=7;q.strokeStyle=rgb(S.shade);q.beginPath();q.moveTo(bx,by);q.quadraticCurveTo(bx+Math.cos(an-0.2)*ln*0.5,by+Math.sin(an-0.2)*ln*0.5,bx+Math.cos(an)*ln,by+Math.sin(an)*ln);q.stroke();
      for(const lf of br.leaves){const fl=(RM?0:1)*Math.sin(t*3.1+lf.ph)*0.18;const px=bx+Math.cos(an)*ln*lf.s+Math.cos(an+1.57)*lf.off*ln+Math.sin(t*1.7+lf.ph)*3,py=by+Math.sin(an)*ln*lf.s+Math.sin(an+1.57)*lf.off*ln+Math.cos(t*1.3+lf.ph)*3;
        q.beginPath();q.ellipse(px,py,lf.r,lf.r*lf.e,lf.rot+fl+sw*3,0,7);q.fill();}}
  }
  if(night>0.05){ // lampa v noci
    q.globalAlpha=night;const r=card.getBoundingClientRect();const lx=r.left+r.width*0.35,ly=r.top-r.height*0.2;const g=q.createRadialGradient(lx,ly,0,lx,ly,Math.max(W,H)*0.55);
    g.addColorStop(0,rgb(S.light));g.addColorStop(0.45,rgb(S.light.map((v,i)=>lerp(v,S.shade[i],0.5))));g.addColorStop(1,rgb(S.shade));q.fillStyle=g;q.fillRect(0,0,W,H);q.globalAlpha=1;}
  c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(lo,0,0,cv.width,cv.height);
  if(!RM)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
